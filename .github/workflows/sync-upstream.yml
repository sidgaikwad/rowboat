# Keeps this fork's `main` a fast-forward mirror of rowboatlabs/rowboat.
# Lives on the fork's default branch (fork-config) so `main` itself never
# carries a commit upstream does not have. Never commit to `main` here;
# branch off it instead.
name: Sync main from upstream

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Fast-forward main from rowboatlabs/rowboat
        run: gh repo sync sidgaikwad/rowboat --source rowboatlabs/rowboat --branch main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
